# A complete, self-contained calendar for one school (fictional example).
# Use it in the UI: Add integration > School Day > Calendar file.

schedules:
  regular:       { start: "08:00", end: "14:45" }
  early_release: { start: "08:00", end: "12:00" }

week: [mon, tue, wed, thu, fri]

school_year:
  from: 2026-09-02
  to: 2027-06-16

days_off:
  - { date: 2026-09-07, name: Labor Day }
  - { date: 2026-11-11, name: Veterans Day }
  - { from: 2026-11-26, to: 2026-11-27, name: Thanksgiving break }
  - { from: 2026-12-21, to: 2027-01-01, name: Winter break }
  - { date: 2027-01-18, name: Martin Luther King Jr. Day }
  - { from: 2027-02-15, to: 2027-02-19, name: Mid-winter break }
  - { from: 2027-04-05, to: 2027-04-09, name: Spring break }
  - { date: 2027-05-31, name: Memorial Day }

special_days:
  - { date: 2026-11-25, schedule: early_release, name: Day before Thanksgiving }
  - { date: 2027-01-29, end: "11:30", name: End of semester }
  - { date: 2027-06-16, schedule: early_release, name: Last day of school }
