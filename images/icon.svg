<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>School Day</title>
  <defs>
    <linearGradient id="bus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD800"/>
      <stop offset="1" stop-color="#F7B500"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="0.45" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#0D0D0D"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- School-bus yellow body -->
    <rect width="512" height="512" fill="url(#bus)"/>
    <!-- Black rub rails, like the side of a school bus -->
    <rect y="408" width="512" height="22" fill="#141414"/>
    <rect y="448" width="512" height="22" fill="#141414"/>
  </g>

  <!-- Ringing lines -->
  <g fill="none" stroke="#141414" stroke-width="18" stroke-linecap="round">
    <path d="M118 176 Q92 226 118 276"/>
    <path d="M78 150 Q40 226 78 302"/>
    <path d="M394 176 Q420 226 394 276"/>
    <path d="M434 150 Q472 226 434 302"/>
  </g>

  <!-- Bell: handle, body, rim, clapper -->
  <rect x="234" y="58" width="44" height="88" rx="22" fill="#141414"/>
  <rect x="226" y="132" width="60" height="22" rx="8" fill="#141414"/>
  <path d="M256 146
           C 206 146, 186 184, 184 236
           C 182 282, 172 306, 150 326
           L 362 326
           C 340 306, 330 282, 328 236
           C 326 184, 306 146, 256 146 Z" fill="url(#bell)"/>
  <rect x="134" y="318" width="244" height="30" rx="15" fill="#141414"/>
  <circle cx="256" cy="372" r="24" fill="#141414"/>
  <!-- Shine -->
  <path d="M214 196 C 206 222, 204 254, 196 286" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="12" stroke-linecap="round"/>
</svg>
